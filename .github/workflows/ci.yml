name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/language_app_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/language_app_test
      JOSE_SECRET_KEY: ci-test-key
      JOSE_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: 1
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      FRONTEND_ORIGIN: http://localhost:5173

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18 # ECR mirror avoids Docker Hub rate limits, which occasionally fail pulls of postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: language_app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run postgres migrations
        run: alembic -c backend/alembic.ini -x db=test upgrade head

      - name: Test with pytest
        run: pytest backend/tests

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
